version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: erp_database
    environment:
      POSTGRES_USER: school_erp_prod
      POSTGRES_PASSWORD: Vaseem@2004
      POSTGRES_DB: school_erp_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_erp_prod -d school_erp_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./cn_backend
      dockerfile: Dockerfile
    container_name: erp_backend
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
